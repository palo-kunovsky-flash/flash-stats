[package]
name = "flash-stats"
version = "0.1.3"
description = "macOS system monitor widgets with a menu-bar network meter"
authors = ["Palo Kunovsky <palo.kunovsky@gmail.com>"]
edition = "2021"
default-run = "flash-stats"
rust-version = "1.85"
license = "MIT"
repository = "https://gitlab.com/palo.kunovsky/flash-stats"

[lib]
name = "flash_stats_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
sysinfo = "0.39"
core-foundation = "0.10"
core-foundation-sys = "0.8"
io-kit-sys = "0.4"
mach2 = "0.6"
libc = "0.2"
objc2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
